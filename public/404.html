<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Uniclinic</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1b3a;
        color: #f4f6fb;
        font-family: Manrope, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 4.5rem;
        font-weight: 700;
        margin: 0;
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 1rem 0 0;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        color: #b7c0d6;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        background: #f4f6fb;
        color: #0b1b3a;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: #dfe5f2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Página não encontrada</h2>
      <p>O endereço acessado não existe ou foi movido.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
